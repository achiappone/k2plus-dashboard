# Regenerate docs/index.html whenever the page it is built from changes.
#
# docs/ is what GitHub Pages serves (main:/docs), and it is GENERATED by
# build_docs.py from the PAGE string in dashboard.py. Editing dashboard.py and
# forgetting to rebuild publishes a stale page that looks fine locally, so this
# closes that gap rather than relying on remembering.
name: Rebuild docs

on:
  push:
    branches: [main]
    # Only the sources docs/ is built FROM. A commit that touches just docs/
    # cannot retrigger this, which is half of the loop protection.
    paths:
      - dashboard.py
      - build_docs.py

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # build_docs.py asserts its anchors still exist in dashboard.py, so this
      # step also fails the build if an edit silently broke the docs pipeline.
      - name: Build
        run: python3 build_docs.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/; then
            echo "docs/ already matches dashboard.py, nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          # [skip ci] is the other half of the loop protection.
          git commit -m "Rebuild docs/ from dashboard.py [skip ci]"
          git push
